<style>
:root {
  --blue:#185FA5;--blue-mid:#378ADD;--blue-light:#E6F1FB;--blue-dark:#0C447C;
  --bg:#fff;--bg2:#F4F6F9;--bg3:#EEF1F5;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.06);
  --radius:12px;--radius-sm:8px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111827;--bg2:#1F2937;--bg3:#374151;
  --text:#F9FAFB;--text2:#9CA3AF;--text3:#6B7280;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.06);
  --blue-light:#0c2d4a;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);}
body{display:flex;flex-direction:column;}
#shell{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;width:100%;background:var(--bg3);}
#scroll-area{flex:1;overflow-y:auto;padding:12px 14px;padding-top:calc(12px + var(--safe-top));}
#nav{display:flex;background:var(--bg);border-top:0.5px solid var(--border);padding-bottom:var(--safe-bot);flex-shrink:0;}
.nav-btn{flex:1;border:none;background:transparent;color:var(--text2);cursor:pointer;padding:8px 4px 6px;font-family:inherit;font-size:10px;line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s;}
.nav-btn i{font-size:22px;}
.nav-btn.on{color:var(--blue);}
.top-card{background:var(--blue);border-radius:var(--radius);padding:14px 20px 18px;margin-bottom:12px;display:flex;flex-direction:column;gap:14px;}
.top-main{display:flex;justify-content:space-between;align-items:flex-end;}
.top-label{font-size:11px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.top-val{font-size:34px;font-weight:600;color:white;line-height:1;}
.top-side{text-align:right;display:flex;flex-direction:column;gap:8px;}
.top-side-item .side-label{font-size:10px;color:rgba(255,255,255,.65);}
.top-side-item .side-val{font-size:15px;font-weight:500;color:white;}
.card{background:var(--bg);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:0.5px solid var(--border2);}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500;}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);outline:none;appearance:none;-webkit-appearance:none;}
input:focus,select:focus{border-color:var(--blue-mid);box-shadow:0 0 0 3px rgba(55,138,221,.15);}
.hm{display:flex;gap:6px;}
.hm select{flex:1;}
.btn-p{background:var(--blue);color:white;border:none;border-radius:var(--radius-sm);padding:12px;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;width:100%;margin-top:4px;}
.btn-p:active{transform:scale(.98);background:var(--blue-dark);}
.period-row{display:flex;gap:6px;margin-bottom:10px;}
.pbtn{padding:7px 14px;border:0.5px solid var(--border);background:var(--bg);color:var(--text2);border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;}
.pbtn.on{background:var(--blue-light);color:var(--blue);border-color:var(--blue-mid);font-weight:500;}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.metric{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;border:0.5px solid var(--border2);}
.metric.hi{background:var(--blue-light);}
.metric .mlabel{font-size:11px;color:var(--text2);margin-bottom:5px;}
.metric.hi .mlabel{color:var(--blue);}
.metric .mval{font-size:20px;font-weight:600;color:var(--text);}
.metric.hi .mval{color:var(--blue);}
.list-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.list{display:flex;flex-direction:column;gap:7px;}
.item{background:var(--bg);border-radius:var(--radius-sm);border:0.5px solid var(--border2);overflow:hidden;}
.item-row{display:flex;align-items:center;gap:10px;padding:11px 13px;}
.iinfo{flex:1;min-width:0;}
.idate{font-size:11px;color:var(--text2);margin-bottom:2px;}
.idesc{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.iamt{text-align:right;flex-shrink:0;}
.iamt-main{font-size:14px;font-weight:600;color:var(--blue);}
.iamt-sub{font-size:11px;color:var(--text2);}
.iact{display:flex;gap:2px;flex-shrink:0;}
.ibtn{background:none;border:none;cursor:pointer;padding:6px;color:var(--text3);font-size:18px;border-radius:6px;}
.ibtn:active{background:var(--bg2);color:var(--text);}
.ibtn.del:active{color:#A32D2D;}
.edit-form{padding:10px 13px 12px;border-top:0.5px solid var(--border2);background:var(--bg2);}
.ef-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ef-btns{display:flex;gap:8px;margin-top:8px;}
.ef-save{flex:1;background:var(--blue);color:white;border:none;border-radius:var(--radius-sm);padding:10px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
.ef-cancel{padding:10px 16px;border:0.5px solid var(--border);background:var(--bg);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;color:var(--text2);font-family:inherit;}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2);}
.empty i{font-size:36px;display:block;margin-bottom:10px;opacity:.4;}
.empty p{font-size:14px;}
.xbtn{display:flex;align-items:center;gap:10px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;font-size:14px;color:var(--text);font-family:inherit;width:100%;margin-bottom:8px;}
.xbtn i{font-size:20px;color:var(--blue);}
.xbtn:active{background:var(--bg3);}
.note{font-size:12px;color:var(--text2);line-height:1.6;margin-top:8px;}
.rate-current{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.rate-big{font-size:28px;font-weight:700;color:var(--blue);}
.rate-label{font-size:13px;color:var(--text2);}
.rate-history{margin-top:14px;}
.rate-history-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.rate-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border2);font-size:13px;}
.rate-row:last-child{border-bottom:none;}
.rate-row .r-date{color:var(--text2);}
.rate-row .r-val{font-weight:600;color:var(--text);}
.rate-row.current .r-val{color:var(--blue);}
.rate-row.current .r-date::before{content:"Nåværende · ";}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px calc(20px + var(--safe-bot));width:100%;max-width:520px;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:12px;}
.modal textarea{height:160px;font-size:12px;font-family:monospace;resize:none;}
.modal-btns{display:flex;gap:8px;margin-top:12px;}
.modal-btns .btn-p{margin-top:0;}
.modal-close{padding:12px;border:0.5px solid var(--border);background:var(--bg2);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;color:var(--text);font-family:inherit;}

.timer-card{background:var(--bg);border-radius:var(--radius);padding:18px 16px;margin-bottom:10px;border:0.5px solid var(--border2);text-align:center;}
.timer-display{font-size:52px;font-weight:200;letter-spacing:3px;color:var(--text);font-variant-numeric:tabular-nums;margin:6px 0 18px;}
.timer-display.running{color:var(--blue);}
.timer-btns{display:flex;gap:10px;justify-content:center;}
.tbtn{flex:1;max-width:120px;border:none;border-radius:var(--radius-sm);padding:12px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;}
.tbtn.start{background:var(--blue);color:white;}
.tbtn.pause{background:var(--bg2);color:var(--text);border:0.5px solid var(--border);}
.tbtn.stop{background:#dcfce7;color:#166534;}.tbtn.reset{background:#fee2e2;color:#991b1b;}
.tbtn:active{transform:scale(.97);}
.timer-desc{margin-top:14px;text-align:left;}

.paid-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.paid-dot.green{background:#16a34a;}
.paid-dot.yellow{background:#d97706;}

.emp-pill{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;max-width:100%;background:#fff;border:none;border-radius:var(--radius-sm);padding:8px 11px;color:var(--blue);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;}
.emp-pill:active{background:#E6F1FB;transform:scale(.98);}
.emp-pill .emp-pill-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.emp-pill i{font-size:14px;opacity:.6;margin-left:-1px;}
.emp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;}
.emp-inline{display:inline-flex;align-items:center;gap:4px;vertical-align:-1px;}
.emp-inline .emp-dot{width:7px;height:7px;}
.sheet-list{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
.sheet-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-radius:var(--radius-sm);padding:12px 10px;font-family:inherit;font-size:15px;color:var(--text);cursor:pointer;text-align:left;}
.sheet-row:active{background:var(--bg2);}
.sheet-row.on{background:var(--blue-light);color:var(--blue);font-weight:500;}
.sheet-row .s-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sheet-row .s-amt{font-size:13px;color:var(--text2);flex-shrink:0;}
.sheet-row.on .s-amt{color:var(--blue);}
.sheet-row i{font-size:18px;color:var(--blue);}
.emp-row{cursor:pointer;}
.color-chips{display:flex;gap:8px;flex-wrap:wrap;}
.color-chip{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.color-chip.on{border-color:var(--text);}
.btn-danger{width:100%;margin-top:14px;background:transparent;border:0.5px solid rgba(163,45,45,.4);color:#A32D2D;border-radius:var(--radius-sm);padding:10px;font-family:inherit;font-size:14px;cursor:pointer;}
.btn-danger:active{background:rgba(163,45,45,.1);}
.timer-emp{margin-top:14px;text-align:left;}
.brk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border2);}
.brk-row:last-child{border-bottom:none;}
.brk-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brk-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.brk-amt{text-align:right;flex-shrink:0;}
.brk-amt .b-main{font-size:14px;font-weight:600;color:var(--blue);}
.brk-amt .b-sub{font-size:11px;color:var(--text2);}
</style>
</head>

<div id="shell">
  <div id="scroll-area">
    <div id="top-card-el"></div>
    <div id="content"></div>
  </div>
  <nav id="nav"></nav>
</div>
<div id="modal-container"></div>

<script>
const APP_VERSION = "1.13";
const LS = {
  get: k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};

let storageWarned = false;
function warnStorage() {
  if (storageWarned) return;
  storageWarned = true;
  alert('Kunne ikke lagre på denne enheten. Lagringen kan være full, eller nettleseren kjører i privat modus. Eksporter dataene dine nå, ellers kan endringer gå tapt.');
}

const EMP_COLORS = ['#378ADD', '#0E7C66', '#B45309', '#7C3AED', '#BE185D', '#0E8AA5', '#4D7C0F', '#BE123C'];

const fmtKr = n => Math.round(n).toLocaleString('nb-NO') + ' kr';
const fmtH = h => { const hrs = Math.floor(h), m = Math.round((h - hrs) * 60); return m > 0 ? `${hrs}t ${m}m` : `${hrs}t`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString('nb-NO', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateShort = d => new Date(d + 'T12:00:00').toLocaleDateString('nb-NO', { day: 'numeric', month: 'short', year: 'numeric' });

function migrateSettings(s) {
  if (!s) return { rateHistory: [{ rate: 100, from: '2000-01-01' }] };
  if (s.hourlyRate && !s.rateHistory) {
    return { rateHistory: [{ rate: s.hourlyRate, from: '2000-01-01' }] };
  }
  return s;
}

const REPEATS = ['once', 'monthly', 'weekly'];
const REPEAT_LABEL = { once: 'Engangsbeløp', monthly: 'Månedlig', weekly: 'Ukentlig' };
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
const SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
const HEX_COLOR = /^#[0-9a-fA-F]{3,8}$/;
const asStr = v => typeof v === 'string' ? v : '';
const asNum = v => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : null; };

function cleanRateHistory(list) {
  const clean = (Array.isArray(list) ? list : [])
    .filter(h => h && ISO_DATE.test(asStr(h.from)) && asNum(h.rate) !== null && asNum(h.rate) >= 0)
    .map(h => ({ rate: asNum(h.rate), from: h.from }));
  return clean.length ? clean : null;
}

// Én felles validering for både oppstart og import. Alt som slipper gjennom her
// er trygt å regne på og trygt å skrive inn i HTML, slik at en ødelagt eller
// håndredigert fil aldri kan sette appen i en tilstand som kaster.
function sanitizeData(rawEmployers, rawEntries, rawPayments, rawFixed, knownIds) {
  const skipped = { employers: 0, entries: 0, payments: 0, fixed: 0 };
  const seenEmp = new Set(), seenE = new Set(), seenP = new Set(), seenF = new Set();

  const employers = [];
  (Array.isArray(rawEmployers) ? rawEmployers : []).forEach((e, i) => {
    if (!e || typeof e !== 'object') { skipped.employers++; return; }
    let id = asStr(e.id);
    if (!SAFE_ID.test(id) || seenEmp.has(id)) id = uid();
    seenEmp.add(id);
    employers.push({
      id,
      name: asStr(e.name).trim().slice(0, 60) || 'Arbeidsgiver ' + (i + 1),
      color: HEX_COLOR.test(asStr(e.color)) ? e.color : EMP_COLORS[i % EMP_COLORS.length],
      rateHistory: cleanRateHistory(e.rateHistory) || [{ rate: 0, from: '2000-01-01' }]
    });
  });

  const kjente = employers.map(e => e.id).concat(Array.isArray(knownIds) ? knownIds : []);

  const entries = [];
  (Array.isArray(rawEntries) ? rawEntries : []).forEach(e => {
    const hours = e && typeof e === 'object' ? asNum(e.hours) : null;
    if (!e || typeof e !== 'object' || !ISO_DATE.test(asStr(e.date)) || hours === null || hours <= 0) { skipped.entries++; return; }
    let id = asStr(e.id);
    if (!SAFE_ID.test(id) || seenE.has(id)) id = uid();
    seenE.add(id);
    entries.push({ id, employerId: kjente.includes(asStr(e.employerId)) ? e.employerId : '',
                   date: e.date, hours, description: asStr(e.description) });
  });

  const payments = [];
  (Array.isArray(rawPayments) ? rawPayments : []).forEach(p => {
    const amount = p && typeof p === 'object' ? asNum(p.amount) : null;
    if (!p || typeof p !== 'object' || !ISO_DATE.test(asStr(p.date)) || amount === null) { skipped.payments++; return; }
    let id = asStr(p.id);
    if (!SAFE_ID.test(id) || seenP.has(id)) id = uid();
    seenP.add(id);
    payments.push({ id, employerId: kjente.includes(asStr(p.employerId)) ? p.employerId : '',
                    date: p.date, amount, description: asStr(p.description) });
  });

  const fixed = [];
  (Array.isArray(rawFixed) ? rawFixed : []).forEach(f => {
    const amount = f && typeof f === 'object' ? asNum(f.amount) : null;
    if (!f || typeof f !== 'object' || !ISO_DATE.test(asStr(f.from)) || amount === null || amount <= 0) { skipped.fixed++; return; }
    let id = asStr(f.id);
    if (!SAFE_ID.test(id) || seenF.has(id)) id = uid();
    seenF.add(id);
    const repeat = REPEATS.includes(asStr(f.repeat)) ? f.repeat : 'once';
    const to = repeat !== 'once' && ISO_DATE.test(asStr(f.to)) && f.to >= f.from ? f.to : null;
    fixed.push({ id, employerId: kjente.includes(asStr(f.employerId)) ? f.employerId : '',
                 amount, repeat, from: f.from, to, description: asStr(f.description) });
  });

  return { employers, entries, payments, fixed, skipped };
}

function loadState() {
  const d = sanitizeData(LS.get('ta:emp'), LS.get('ta:e'), LS.get('ta:p'), LS.get('ta:f'));
  if (!d.employers.length) {
    // Første gang: lag én arbeidsgiver av den gamle, globale timelønn-historikken
    let legacy = null;
    try { legacy = cleanRateHistory(migrateSettings(LS.get('ta:s')).rateHistory); } catch { legacy = null; }
    d.employers.push({ id: uid(), name: 'Min arbeidsgiver', color: EMP_COLORS[0],
                       rateHistory: legacy || [{ rate: 100, from: '2000-01-01' }] });
  }
  const ids = d.employers.map(e => e.id);
  const fallback = ids[0];
  d.entries.forEach(e => { if (!e.employerId) e.employerId = fallback; });
  d.payments.forEach(p => { if (!p.employerId) p.employerId = fallback; });
  d.fixed.forEach(f => { if (!f.employerId) f.employerId = fallback; });
  let active = asStr(LS.get('ta:active')) || 'all';
  if (active !== 'all' && !ids.includes(active)) active = 'all';
  let last = asStr(LS.get('ta:last'));
  if (!ids.includes(last)) last = fallback;
  return { employers: d.employers, entries: d.entries, payments: d.payments, fixed: d.fixed,
           activeEmployer: active, lastEmployer: last, skipped: d.skipped,
           tab: 'hours', period: 'month', fixedKind: 'monthly',
           editE: null, editP: null, editEmp: null, editF: null };
}

}

function empById(id) { return S.employers.find(e => e.id === id) || null; }
function empName(id) { const e = empById(id); return e ? e.name : 'Ukjent'; }
function empColor(id) { const e = empById(id); return e ? e.color : '#9CA3AF'; }
function isAll() { return S.activeEmployer === 'all'; }
function isMulti() { return S.employers.length > 1; }
function defaultEmployerId() {
  if (!S.employers.length) return null;
  return isAll() ? (empById(S.lastEmployer) ? S.lastEmployer : S.employers[0].id) : S.activeEmployer;
}
function scopedEntries() { return isAll() ? S.entries : S.entries.filter(e => e.employerId === S.activeEmployer); }
function scopedPayments() { return isAll() ? S.payments : S.payments.filter(p => p.employerId === S.activeEmployer); }
function scopedFixed() { return isAll() ? S.fixed : S.fixed.filter(f => f.employerId === S.activeEmployer); }
function normalizeActive() {
  if (S.employers.length === 1) S.activeEmployer = S.employers[0].id;
  else if (!isAll() && !empById(S.activeEmployer)) S.activeEmployer = 'all';
}
const empOpts = sel => S.employers.map(e => `<option value="${e.id}"${e.id === sel ? ' selected' : ''}>${esc(e.name)}</option>`).join('');
const allDot = () => {
  const c = S.employers.map(e => e.color);
  return `linear-gradient(135deg, ${c[0] || '#185FA5'} 0 50%, ${c[1] || '#0E7C66'} 50% 100%)`;
};

function rateForDate(date, employerId) {
  const emp = empById(employerId);
  if (!emp) return 0;
  const hist = [...emp.rateHistory].sort((a, b) => a.from.localeCompare(b.from));
  let rate = hist[0].rate;
  for (const h of hist) {
    if (h.from <= date) rate = h.rate;
    else break;
  }
  return rate;
}

function currentRate(employerId) { return rateForDate(today(), employerId); }
function entryAmount(e) { return e.hours * rateForDate(e.date, e.employerId); }

const isoOf = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

// Datoene et fast beløp har forfalt på, til og med i dag. Gjentakelser regnes ut
// ved behov i stedet for å lagres, slik at ingenting må «kjøres» i bakgrunnen.
function fixedOccurrences(f, until) {
  const slutt = f.to && f.to < (until || today()) ? f.to : (until || today());
  const ut = [];
  if (!f.from || f.from > slutt) return ut;
  if (f.repeat === 'once') { ut.push(f.from); return ut; }
  if (f.repeat === 'weekly') {
    const d = new Date(f.from + 'T12:00:00');
    let vakt = 0;
    while (vakt++ < 3000) {
      const iso = isoOf(d);
      if (iso > slutt) break;
      ut.push(iso);
      d.setDate(d.getDate() + 7);
    }
    return ut;
  }
  const start = new Date(f.from + 'T12:00:00');
  const dag = start.getDate();
  let y = start.getFullYear(), m = start.getMonth(), vakt = 0;
  while (vakt++ < 1200) {
    const sisteIMnd = new Date(y, m + 1, 0).getDate();   // klemmer den 31. inn i korte måneder
    const iso = isoOf(new Date(y, m, Math.min(dag, sisteIMnd), 12));
    if (iso > slutt) break;
    if (iso >= f.from) ut.push(iso);
    m++; if (m > 11) { m = 0; y++; }
  }
  return ut;
}

function fixedNext(f) {
  if (f.repeat === 'once') return f.from > today() ? f.from : null;
  const ettÅrFram = isoOf(new Date(new Date().getFullYear() + 1, new Date().getMonth(), new Date().getDate()));
  const alle = fixedOccurrences(f, ettÅrFram);
  return alle.find(d => d > today()) || null;
}

function fixedEarnings(list) {
  const ut = [];
  (list || S.fixed).forEach(f => fixedOccurrences(f).forEach(date => ut.push({ date, amount: f.amount, employerId: f.employerId })));
  return ut;
}

function fixedEarned(list) { return fixedEarnings(list).reduce((s, o) => s + o.amount, 0); }

function inPeriod(items, key) {
  const now = new Date();
  if (S.period === 'week') {
    const day = now.getDay() || 7, mon = new Date(now);
    mon.setDate(now.getDate() - day + 1); mon.setHours(0, 0, 0, 0);
    return items.filter(i => new Date(i[key]) >= mon);
  }
  if (S.period === 'all') return items;
  const ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0'); return items.filter(i => i[key].slice(0, 7) === ym);
}

function totals(entries, payments, fixed) {
  const es = entries || scopedEntries(), ps = payments || scopedPayments(), fs = fixed || scopedFixed();
  const timer = es.reduce((s, e) => s + entryAmount(e), 0);
  const fast = fixedEarned(fs);
  const paid = ps.reduce((s, p) => s + p.amount, 0);
  return { timer, fast, earned: timer + fast, paid, outstanding: timer + fast - paid };
}

function totalsFor(empId) {
  return totals(S.entries.filter(e => e.employerId === empId),
                S.payments.filter(p => p.employerId === empId),
                S.fixed.filter(f => f.employerId === empId));
}


function calcPaidStatus() {
  // Per arbeidsgiver: eldste inntekt først, utbetalinger fordeles fortløpende.
  // Faste beløp tas med i fordelingen, ellers ville timene sett betalt ut for tidlig.
  const status = {};
  for (const emp of S.employers) {
    const inntekter = [
      ...S.entries.filter(e => e.employerId === emp.id).map(e => ({ date: e.date, amt: entryAmount(e), id: e.id })),
      ...fixedEarnings(S.fixed.filter(f => f.employerId === emp.id)).map(o => ({ date: o.date, amt: o.amount, id: null }))
    ].sort((a, b) => a.date.localeCompare(b.date));
    let remaining = S.payments.filter(p => p.employerId === emp.id).reduce((s,p) => s+p.amount, 0);
    for (const i of inntekter) {
      if (remaining >= i.amt - 0.01) {
        if (i.id) status[i.id] = 'green';
        remaining -= i.amt;
      } else if (i.id) {
        status[i.id] = 'yellow';
      }
    }
  }
  return status;
}



function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

          <div class="top-side-item"><div class="side-label">Utbetalt</div><div class="side-val">${fmtKr(paid)}</div></div>

function openEmployerSheet() {
  const rows = [];
  if (isMulti()) {
    const t = totals(S.entries, S.payments, S.fixed);
    rows.push(`<button class="sheet-row${isAll() ? ' on' : ''}" onclick="setEmployer('all')">
      <span class="emp-dot" style="background:${allDot()}"></span>
      <span class="s-name">Alle arbeidsgivere</span>
      <span class="s-amt">${fmtKr(t.outstanding)}</span>
      ${isAll() ? '<i class="ti ti-check"></i>' : ''}
    </button>`);
  }
  S.employers.forEach(e => {
    const t = totalsFor(e.id);
    const on = S.activeEmployer === e.id;
    rows.push(`<button class="sheet-row${on ? ' on' : ''}" onclick="setEmployer('${e.id}')">
      <span class="emp-dot" style="background:${e.color}"></span>
      <span class="s-name">${esc(e.name)}</span>
      <span class="s-amt">${fmtKr(t.outstanding)}</span>
      ${on ? '<i class="ti ti-check"></i>' : ''}
    </button>`);
  });
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">Velg arbeidsgiver</div>
        <div class="sheet-list">${rows.join('')}</div>
        <button class="xbtn" onclick="showAddEmployer()"><i class="ti ti-plus"></i> Ny arbeidsgiver</button>
        <button class="xbtn" style="margin-bottom:0" onclick="closeModal();goManageEmployers()"><i class="ti ti-settings"></i> Administrer arbeidsgivere</button>
        <div class="modal-btns"><button class="modal-close" style="flex:1" onclick="closeModal()">Lukk</button></div>
      </div>
    </div>`;
}

function setEmployer(id) {
  S.activeEmployer = id;
  if (id !== 'all') S.lastEmployer = id;
  if (timerState.status === 'idle') { timerState.employerId = defaultEmployerId(); saveTimer(); }
  S.editE = null; S.editP = null; S.editF = null;
  save(); closeModal(); render();
  document.getElementById('scroll-area').scrollTop = 0;
}

function goManageEmployers() { S.tab = 'settings'; S.editEmp = null; render(); document.getElementById('scroll-area').scrollTop = 0; }

const minsOpts = (sel = 0) => Array.from({ length: 12 }, (_, i) => i * 5).map(m => `<option value="${m}"${m === sel ? ' selected' : ''}>${String(m).padStart(2, '0')}</option>`).join('');

}

function tabHours() {

  const elapsed = timerElapsed();
  const isRunning = timerState.status === 'running';
  const isPaused = timerState.status === 'paused';
  const isActive = isRunning || isPaused;
  const timerUI = `
    <div class="timer-card">
      <div id="timer-display" class="timer-display${isRunning ? ' running' : ''}">${fmtTimerDisplay(elapsed)}</div>
      <div class="timer-btns">
        ${!isActive ? `<button class="tbtn start" onclick="startTimer()">▶ Start</button>` : ''}
        ${isRunning ? `<button class="tbtn pause" onclick="pauseTimer()">⏸ Pause</button>` : ''}
        ${isPaused ? `<button class="tbtn start" onclick="startTimer()">▶ Fortsett</button>` : ''}
        ${isActive ? `<button class="tbtn stop" onclick="stopTimer()">⏹ Lagre</button>` : ''}
        ${isActive ? `<button class="tbtn reset" onclick="if(confirm('Er du sikker på at du vil slette denne økten?'))resetTimer()" style="max-width:44px;padding:12px 8px;">✕</button>` : ''}
      </div>
      ${isMulti() ? `<div class="timer-emp field">
        <label>Føres på</label>
        <select onchange="setTimerEmployer(this.value)">${empOpts(timerState.employerId)}</select>
      </div>` : ''}
      ${isActive ? `<div class="timer-desc field" style="margin-top:14px;text-align:left;">
        <label>Beskrivelse</label>
        <input type="text" value="${esc(timerState.desc)}" oninput="timerDescChange(this.value)" placeholder="Hva jobber du med?">
      </div>` : ''}
    </div>`;

  const scoped = scopedEntries();
  const fil = inPeriod(scoped, 'date');
  const ph = fil.reduce((s, e) => s + e.hours, 0);
  const pamt = fil.reduce((s, e) => s + entryAmount(e), 0);
  const sorted = [...scoped].sort((a, b) => b.date.localeCompare(a.date));
  const paidStatus = calcPaidStatus();
  const showEmp = isAll() && isMulti();

  const items = sorted.map(e => {
    const r = rateForDate(e.date, e.employerId);
    if (S.editE === e.id) {

      return `<div class="item">
        <div class="item-row">
          <div class="iinfo"><div class="idate">${fmtDate(e.date)}</div><div class="idesc">${esc(e.description) || '—'}</div></div>
          <div class="iact"><button class="ibtn del" onclick="cancelEditE()">✕</button></div>
        </div>
        <div class="edit-form">
          ${isMulti() ? `<div class="field" style="margin-bottom:8px"><label>Arbeidsgiver</label><select id="ee-emp">${empOpts(e.employerId)}</select></div>` : ''}
          <div class="ef-row">
            <div class="field"><label>Dato</label><input type="date" id="ee-date" value="${e.date}"></div>
            <div class="field"><label>Timer / min</label><div class="hm"><select id="ee-h">${hoursOpts(hrs)}</select><select id="ee-m">${minsOpts(mins)}</select></div></div>
          </div>
          <div class="field"><label>Beskrivelse</label><input type="text" id="ee-desc" value="${esc(e.description)}"></div>
          <div class="ef-btns">
            <button class="ef-save" onclick="saveEditE('${e.id}')">Lagre</button>
            <button class="ef-cancel" onclick="cancelEditE()">Avbryt</button>
          </div>
        </div>

    }
    const empTag = showEmp
      ? ` · <span class="emp-inline"><span class="emp-dot" style="background:${empColor(e.employerId)}"></span>${esc(empName(e.employerId))}</span>`
      : '';
    return `<div class="item">

function fixedMeta(f) {
  const fra = fmtDateShort(f.from);
  if (f.repeat === 'once') return 'Engangsbeløp · ' + fra;
  const gjentakelse = f.repeat === 'monthly' ? 'Hver måned' : 'Hver uke';
  return gjentakelse + ' fra ' + fra + (f.to ? ' til ' + fmtDateShort(f.to) : '');
}

    + '<span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#B5D4F4;display:inline-block;"></span>Utbetalt</span>'
    + '</div>'

function renderChart() {
  if (_chart) { _chart.destroy(); _chart = null; }
  const canvas = document.getElementById('mchart');
  if (!canvas) return;
  const now = new Date();
  const months = Array.from({ length: 6 }, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    return { key, label: d.toLocaleDateString('nb-NO', { month: 'short', year: '2-digit' }) };
  });
  const chartE = scopedEntries(), chartP = scopedPayments(), chartF = fixedEarnings(scopedFixed());
  const earnedData = months.map(m =>
    Math.round(chartE.filter(e => e.date.startsWith(m.key)).reduce((s, e) => s + entryAmount(e), 0)
             + chartF.filter(o => o.date.startsWith(m.key)).reduce((s, o) => s + o.amount, 0)));
  const paidData   = months.map(m => Math.round(chartP.filter(p => p.date.startsWith(m.key)).reduce((s, p) => s + p.amount, 0)));
  _chart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: months.map(m => m.label),
      datasets: [
        { label: 'Opptjent', data: earnedData, backgroundColor: '#378ADD', borderRadius: 4, borderSkipped: false },
        { label: 'Utbetalt', data: paidData,   backgroundColor: '#B5D4F4', borderRadius: 4, borderSkipped: false }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { beginAtZero: true, suggestedMax: 1000,
             ticks: { callback: v => v.toLocaleString('nb-NO'), font: { size: 11 } },
             grid: { color: 'rgba(128,128,128,0.1)' } }
      }
    }
  });
}

function setTab(t) { S.tab = t; S.editE = null; S.editP = null; S.editEmp = null; S.editF = null; render(); document.getElementById('scroll-area').scrollTop = 0; }
function setPeriod(p) { S.period = p; renderContent(); }

function addE() {
  const date = document.getElementById('e-date').value;
  const h = parseInt(document.getElementById('e-h').value) || 0;
  const m = parseInt(document.getElementById('e-m').value) || 0;
  const desc = (document.getElementById('e-desc').value || '').trim();
  const empSel = document.getElementById('e-emp');
  const employerId = empSel ? empSel.value : defaultEmployerId();
  const r = rateForDate(date, employerId);
  const hours = h + m / 60;
  if (!date || (h + m) === 0) { alert('Velg dato og minst 5 minutter'); return; }
  const kr = Math.round(hours * r).toLocaleString('nb-NO');
  const hStr = h > 0 && m > 0 ? h + 't ' + m + 'min' : h > 0 ? h + 't' : m + 'min';
  const forWho = isMulti() ? ' på ' + empName(employerId) : '';
  if (!confirm('Legg til ' + hStr + ' (' + kr + ' kr)' + forWho + ' den ' + new Date(date+'T12:00:00').toLocaleDateString('nb-NO', {day:'numeric',month:'long'}) + '?')) return;
  S.entries.push({ id: uid(), employerId, date, hours, description: desc });
  S.lastEmployer = employerId;
  save(); render();
}
function delE(id) { if (!confirm('Slett denne registreringen?')) return; S.entries = S.entries.filter(e => e.id !== id); save(); render(); }
function startEditE(id) { S.editE = id; renderContent(); }
function cancelEditE() { S.editE = null; renderContent(); }
function saveEditE(id) {
  const e = S.entries.find(x => x.id === id); if (!e) return;
  const h = parseInt(document.getElementById('ee-h').value) || 0;
  const m = parseInt(document.getElementById('ee-m').value) || 0;
  if (!document.getElementById('ee-date').value || (h + m) === 0) { alert('Velg dato og tid'); return; }
  const empSel = document.getElementById('ee-emp');
  if (empSel) e.employerId = empSel.value;
  e.date = document.getElementById('ee-date').value;
  e.hours = h + m / 60;
  e.description = (document.getElementById('ee-desc').value || '').trim();
  S.editE = null; save(); render();
}

function addP() {
  const date = document.getElementById('p-date').value;
  const amount = parseFloat(document.getElementById('p-amt').value);
  const empSel = document.getElementById('p-emp');
  const employerId = empSel ? empSel.value : defaultEmployerId();
  if (!date || isNaN(amount) || amount <= 0) { alert('Fyll inn dato og beløp'); return; }
  S.payments.push({ id: uid(), employerId, date, amount, description: (document.getElementById('p-desc').value || '').trim() });
  S.lastEmployer = employerId;
  save(); render();
}
function delP(id) { if (!confirm('Slett denne utbetalingen?')) return; S.payments = S.payments.filter(p => p.id !== id); save(); render(); }
function startEditP(id) { S.editP = id; renderContent(); }
function cancelEditP() { S.editP = null; renderContent(); }
function saveEditP(id) {
  const p = S.payments.find(x => x.id === id); if (!p) return;
  const amount = parseFloat(document.getElementById('ep-amt').value);
  if (!document.getElementById('ep-date').value || isNaN(amount) || amount <= 0) { alert('Fyll inn dato og beløp'); return; }
  const empSel = document.getElementById('ep-emp');
  if (empSel) p.employerId = empSel.value;
  p.date = document.getElementById('ep-date').value;
  p.amount = amount;
  p.description = (document.getElementById('ep-desc').value || '').trim();
  S.editP = null; save(); render();
}

function setFixedKind(k) { S.fixedKind = k; renderContent(); }
function setEditFKind(k) { S.editFKind = k; renderContent(); }

function addF() {
  const amount = parseFloat(document.getElementById('f-amt').value);
  const from = document.getElementById('f-from').value;
  const toEl = document.getElementById('f-to');
  const to = toEl && toEl.value ? toEl.value : null;
  const empSel = document.getElementById('f-emp');
  const employerId = empSel ? empSel.value : defaultEmployerId();
  const repeat = S.fixedKind;
  if (isNaN(amount) || amount <= 0) { alert('Fyll inn et beløp'); return; }
  if (!from) { alert('Velg en dato'); return; }
  if (to && to < from) { alert('Til-datoen kan ikke være før fra-datoen'); return; }
  S.fixed.push({ id: uid(), employerId, amount, repeat, from, to,
                 description: (document.getElementById('f-desc').value || '').trim() });
  S.lastEmployer = employerId;
  save(); render();
}

function delF(id) {
  const f = S.fixed.find(x => x.id === id); if (!f) return;
  const ant = fixedOccurrences(f).length;
  const advarsel = ant > 0 ? '\n\n' + fmtKr(ant * f.amount) + ' som er opptjent hittil forsvinner fra regnskapet.' : '';
  if (!confirm('Slett dette faste beløpet?' + advarsel)) return;
  S.fixed = S.fixed.filter(x => x.id !== id);
  save(); render();
}

function startEditF(id) {
  const f = S.fixed.find(x => x.id === id); if (!f) return;
  S.editF = id; S.editFKind = f.repeat; renderContent();
}
function cancelEditF() { S.editF = null; renderContent(); }

function saveEditF(id) {
  const f = S.fixed.find(x => x.id === id); if (!f) return;
  const amount = parseFloat(document.getElementById('ef-amt').value);
  const from = document.getElementById('ef-from').value;
  const toEl = document.getElementById('ef-to');
  const to = toEl && toEl.value ? toEl.value : null;
  const repeat = document.getElementById('ef-repeat').value;
  if (isNaN(amount) || amount <= 0) { alert('Fyll inn et beløp'); return; }
  if (!from) { alert('Velg en dato'); return; }
  if (to && to < from) { alert('Til-datoen kan ikke være før fra-datoen'); return; }
  const empSel = document.getElementById('ef-emp');
  if (empSel) f.employerId = empSel.value;
  f.amount = amount;
  f.repeat = REPEATS.includes(repeat) ? repeat : 'once';
  f.from = from;
  f.to = f.repeat === 'once' ? null : to;
  f.description = (document.getElementById('ef-desc').value || '').trim();
  S.editF = null; save(); render();
}

function toggleEmp(id) { S.editEmp = S.editEmp === id ? null : id; renderContent(); }

function saveEmpName(id) {
  const emp = empById(id); if (!emp) return;
  const name = (document.getElementById('emp-name-' + id).value || '').trim();
  if (!name) { alert('Skriv inn et navn'); return; }
  if (S.employers.some(e => e.id !== id && e.name.toLowerCase() === name.toLowerCase())) { alert('Du har allerede en arbeidsgiver med dette navnet'); return; }
  emp.name = name;
  save(); render();
}

// Beholder et navn brukeren har skrevet, men ikke lagret, gjennom en ny render
function keepNameDraft(id, fn) {
  const el = document.getElementById('emp-name-' + id);
  const utkast = el ? el.value : null;
  fn();
  const etter = document.getElementById('emp-name-' + id);
  if (etter && utkast !== null) etter.value = utkast;
}

function setEmpColor(id, color) {
  const emp = empById(id); if (!emp) return;
  emp.color = color;
  keepNameDraft(id, () => { save(); render(); });
}

function showAddEmployer() {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">Ny arbeidsgiver</div>
        <div class="field" style="margin-bottom:10px;"><label>Navn</label><input type="text" id="new-emp-name" placeholder="F.eks. Bedrift AS"></div>
        <div class="field"><label>Timelønn (kr/t)</label><input type="number" id="new-emp-rate" placeholder="0" min="0" step="10"></div>
        <div class="modal-btns">
          <button class="btn-p" onclick="addEmployer()">Legg til</button>
          <button class="modal-close" onclick="closeModal()">Avbryt</button>
        </div>
      </div>
    </div>`;
  const inp = document.getElementById('new-emp-name');
  if (inp) inp.focus();
}

function addEmployer() {
  const name = (document.getElementById('new-emp-name').value || '').trim();
  const rate = parseFloat(document.getElementById('new-emp-rate').value);
  if (!name) { alert('Skriv inn et navn'); return; }
  if (S.employers.some(e => e.name.toLowerCase() === name.toLowerCase())) { alert('Du har allerede en arbeidsgiver med dette navnet'); return; }
  if (isNaN(rate) || rate <= 0) { alert('Skriv inn en gyldig timelønn'); return; }
  const used = S.employers.map(e => e.color);
  const color = EMP_COLORS.find(c => !used.includes(c)) || EMP_COLORS[S.employers.length % EMP_COLORS.length];
  const id = uid();
  S.employers.push({ id, name, color, rateHistory: [{ rate, from: '2000-01-01' }] });
  S.activeEmployer = id; S.lastEmployer = id;
  normalizeActive();
  if (timerState.status === 'idle') { timerState.employerId = id; saveTimer(); }
  S.editEmp = null;
  save(); closeModal(); render();
  document.getElementById('scroll-area').scrollTop = 0;
}

function deleteEmployer(id) {
  if (S.employers.length <= 1) { alert('Du må ha minst én arbeidsgiver.'); return; }
  const nE = S.entries.filter(e => e.employerId === id).length;
  const nP = S.payments.filter(p => p.employerId === id).length;
  const nF = S.fixed.filter(f => f.employerId === id).length;
  const name = empName(id);
  if (nE || nP || nF) {
    if (!confirm('Slett «' + name + '»?\n\n' + nE + ' timeregistreringer, ' + nF + ' faste beløp og ' + nP + ' utbetalinger slettes samtidig. Dette kan ikke angres.')) return;
    if (!confirm('Er du helt sikker? All data for «' + name + '» forsvinner.')) return;
  } else if (!confirm('Slett «' + name + '»?')) return;
  S.employers = S.employers.filter(e => e.id !== id);
  S.entries = S.entries.filter(e => e.employerId !== id);
  S.payments = S.payments.filter(p => p.employerId !== id);
  S.fixed = S.fixed.filter(f => f.employerId !== id);
  if (S.activeEmployer === id) S.activeEmployer = 'all';
  if (S.lastEmployer === id) S.lastEmployer = S.employers[0].id;
  normalizeActive();
  if (!empById(timerState.employerId)) { timerState.employerId = defaultEmployerId(); saveTimer(); }
  S.editEmp = null;
  save(); render();
}

function saveRate(empId) {
  const emp = empById(empId); if (!emp) return;
  const v = parseFloat(document.getElementById('rate-val-' + empId).value);
  const from = document.getElementById('rate-from-' + empId).value || today();
  if (isNaN(v) || v <= 0) { alert('Skriv inn en gyldig timelønn'); return; }
  const existing = emp.rateHistory.find(h => h.from === from);
  if (existing) {
    if (!confirm('Du har allerede en sats fra ' + fmtDateShort(from) + ' (' + existing.rate.toLocaleString('nb-NO') + ' kr/t). Erstatte den?')) return;
    existing.rate = v;
  } else {
    emp.rateHistory.push({ rate: v, from });
  }
  keepNameDraft(empId, () => { save(); render(); });
}

function deleteRate(empId, from) {
  const emp = empById(empId); if (!emp) return;
  if (emp.rateHistory.length <= 1) return;
  if (!confirm('Slett denne timelønnen fra historikken? Timer i denne perioden regnes om til satsen som gjaldt før.')) return;
  emp.rateHistory = emp.rateHistory.filter(h => h.from !== from);
  keepNameDraft(empId, () => { save(); render(); });
}

function exportData() {
  const json = JSON.stringify({ version: APP_VERSION, employers: S.employers, entries: S.entries, payments: S.payments, fixed: S.fixed, exportedAt: new Date().toISOString() }, null, 2);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (isIOS) {
    showExportModal(json);
  } else {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'timeapp-backup-' + today() + '.json'; a.click();
    URL.revokeObjectURL(url);
  }
}

function showExportModal(json) {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">Eksporter data</div>
        <p style="font-size:13px;color:var(--text2);margin-bottom:10px;">Kopier JSON-teksten og lagre den som backup.</p>
        <textarea readonly onclick="this.select()">${json.replace(/</g, '&lt;')}</textarea>
        <div class="modal-btns">
          <button class="btn-p" onclick="copyExport(this)">Kopier til utklippstavle</button>
          <button class="modal-close" onclick="closeModal()">Lukk</button>
        </div>
      </div>
    </div>`;
}

function copyExport(btn) {
  const ta = document.querySelector('#modal-container textarea');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(() => { btn.textContent = '✓ Kopiert!'; setTimeout(() => btn.textContent = 'Kopier til utklippstavle', 2000); });
  } else { ta.select(); document.execCommand('copy'); btn.textContent = '✓ Kopiert!'; }
}

function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function importData(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || typeof data !== 'object' || !Array.isArray(data.entries) || !Array.isArray(data.payments)) {
        alert('Ugyldig fil – mangler data'); return;
      }
      const legacy = !Array.isArray(data.employers) || data.employers.length === 0;
      const target = defaultEmployerId();
      // Samme validering som ved oppstart: ugyldige poster slipper aldri inn i appen
      const ren = sanitizeData(data.employers, data.entries, data.payments, data.fixed, S.employers.map(e => e.id));
      const newEmps = ren.employers.filter(e => !S.employers.find(x => x.id === e.id));
      const newE = ren.entries.filter(e => !S.entries.find(x => x.id === e.id));
      const newP = ren.payments.filter(p => !S.payments.find(x => x.id === p.id));
      const newF = ren.fixed.filter(f => !S.fixed.find(x => x.id === f.id));
      const forkastet = ren.skipped.employers + ren.skipped.entries + ren.skipped.payments + ren.skipped.fixed;
      let msg = `Importer ${newE.length} nye timeregistreringer og ${newP.length} nye utbetalinger`;
      if (newF.length) msg += `, ${newF.length} nye faste beløp`;
      if (newEmps.length) msg += ` og ${newEmps.length} nye arbeidsgivere`;
      msg += '?';
      if (legacy) msg += `\n\nFilen er fra en eldre versjon uten arbeidsgivere. Alt legges på «${empName(target)}».`;
      if (forkastet) msg += `\n\n${forkastet} poster i filen er ugyldige og hoppes over.`;
      if (!confirm(msg)) return;
      // Eldre fil: overta timelønn-historikken hvis mottakeren ikke har timer fra før
      if (legacy && data.settings && !S.entries.some(e => e.employerId === target)) {
        let hist = null;
        try { hist = cleanRateHistory(migrateSettings(data.settings).rateHistory); } catch {}
        const emp = empById(target);
        if (emp && hist) emp.rateHistory = hist;
      }
      newEmps.forEach(e => S.employers.push(e));
      newE.forEach(e => { if (!e.employerId) e.employerId = target; });
      newP.forEach(p => { if (!p.employerId) p.employerId = target; });
      newF.forEach(f => { if (!f.employerId) f.employerId = target; });
      S.entries = [...S.entries, ...newE];
      S.payments = [...S.payments, ...newP];
      S.fixed = [...S.fixed, ...newF];
      normalizeActive();
      save(); render(); alert('Import fullført!');
    } catch (err) { alert('Kunne ikke lese filen: ' + err.message); }
  };
  reader.readAsText(file);
  input.value = '';
}

// --- Timer state ---
let timerInterval = null;
let timerState = { status: 'idle', startedAt: null, accumulated: 0, desc: '', employerId: null };
try {
  const ts = localStorage.getItem('ta:timer');
  const parsed = ts ? JSON.parse(ts) : null;
  if (parsed && typeof parsed === 'object') {
    timerState = {
      status: ['running', 'paused'].includes(parsed.status) ? parsed.status : 'idle',
      startedAt: asNum(parsed.startedAt),
      accumulated: Math.max(asNum(parsed.accumulated) || 0, 0),
      desc: asStr(parsed.desc),
      employerId: asStr(parsed.employerId)
    };
    if (timerState.status === 'running' && !timerState.startedAt) timerState.status = 'paused';
  }
} catch {}
if (!empById(timerState.employerId)) timerState.employerId = defaultEmployerId();

function saveTimer() { try { localStorage.setItem('ta:timer', JSON.stringify(timerState)); } catch{} }

function timerElapsed() {
  let total = timerState.accumulated;
  if (timerState.status === 'running' && timerState.startedAt) {
    total += Date.now() - timerState.startedAt;
  }
  return total;
}

function fmtTimerDisplay(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function tickTimer() {
  const el = document.getElementById('timer-display');
  if (el) el.textContent = fmtTimerDisplay(timerElapsed());
}

function startTimer() {
  timerState.status = 'running';
  timerState.startedAt = Date.now();
  saveTimer();
  if (!timerInterval) timerInterval = setInterval(tickTimer, 500);
  renderContent();
}

function pauseTimer() {
  timerState.accumulated = timerElapsed();
  timerState.startedAt = null;
  timerState.status = 'paused';
  saveTimer();
  clearInterval(timerInterval); timerInterval = null;
  renderContent();
}

function stopTimer() {
  const ms = timerElapsed();
  if (ms < 60000 && !confirm('Under 1 minutt registrert – vil du likevel legge til?')) return;
  const hours = Math.round(ms / (1000 * 60 * 5)) * (5/60); // round to 5-min
  const desc = timerState.desc || '';
  const employerId = empById(timerState.employerId) ? timerState.employerId : defaultEmployerId();
  timerState = { status: 'idle', startedAt: null, accumulated: 0, desc: '', employerId };
  saveTimer();
  clearInterval(timerInterval); timerInterval = null;
  S.entries.push({ id: uid(), employerId, date: today(), hours: Math.max(hours, 5/60), description: desc });
  S.lastEmployer = employerId;
  save(); render();
}

function resetTimer() {
  timerState = { status: 'idle', startedAt: null, accumulated: 0, desc: '', employerId: timerState.employerId };
  saveTimer();
  clearInterval(timerInterval); timerInterval = null;
  renderContent();
}

function setTimerEmployer(id) {
  timerState.employerId = id;
  saveTimer();
}

function timerDescChange(val) {
  timerState.desc = val;
  saveTimer();
}

// Resume interval on page load if running
if (timerState.status === 'running') {
  timerInterval = setInterval(tickTimer, 500);
}

// Siste utvei: vis rådataene så de kan kopieres ut, i stedet for en tom skjerm.
// Rører aldri lagringen, slik at ingenting går tapt.
function showRecovery(err) {
  const raw = {};
  ['ta:emp', 'ta:e', 'ta:p', 'ta:f', 'ta:s', 'ta:timer', 'ta:active', 'ta:last', 'ta:raw-backup'].forEach(k => {
    try { const v = localStorage.getItem(k); if (v !== null) raw[k] = v; } catch {}
  });
  const wrap = document.createElement('div');
  wrap.style.cssText = 'max-width:520px;margin:0 auto;padding:24px 16px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
  const h = document.createElement('div');
  h.textContent = 'Appen klarte ikke å starte';
  h.style.cssText = 'font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text);';
  const p = document.createElement('p');
  p.textContent = 'Dataene dine ligger fortsatt lagret, men noe i dem kunne ikke leses. Kopier teksten under og ta vare på den før du gjør noe annet.';
  p.style.cssText = 'font-size:14px;line-height:1.5;color:var(--text2);margin-bottom:12px;';
  const ta = document.createElement('textarea');
  ta.readOnly = true;
  ta.value = JSON.stringify(raw, null, 2);
  ta.style.cssText = 'width:100%;height:220px;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg2);color:var(--text);';
  const btn = document.createElement('button');
  btn.textContent = 'Kopier data';
  btn.style.cssText = 'width:100%;margin-top:12px;padding:12px;border:none;border-radius:8px;background:#185FA5;color:#fff;font-size:15px;font-family:inherit;cursor:pointer;';
  btn.onclick = () => { ta.select(); try { document.execCommand('copy'); btn.textContent = 'Kopiert'; } catch {} };
  const d = document.createElement('p');
  d.textContent = 'Teknisk detalj: ' + ((err && err.message) || 'ukjent feil');
  d.style.cssText = 'font-size:11px;color:var(--text3);margin-top:14px;word-break:break-word;';
  wrap.append(h, p, ta, btn, d);
  document.body.innerHTML = '';
  document.body.appendChild(wrap);
}

if (bootFeil) {
  showRecovery(bootFeil);
} else {
  try {
    const sk = S.skipped, tapt = sk.employers + sk.entries + sk.payments + sk.fixed;
    if (tapt > 0) backupRaw();   // må skje før save(), som ellers overskriver originalen
    save();   // sikrer at migrerte arbeidsgiver-ID-er lagres første gang
    saveTimer();
    render();
    if (tapt > 0) {
      alert('Noe av den lagrede dataen kunne ikke leses og er utelatt: '
        + sk.entries + ' timeregistreringer, ' + sk.fixed + ' faste beløp, ' + sk.payments + ' utbetalinger, ' + sk.employers + ' arbeidsgivere.\n\n'
        + 'En kopi av originalen er tatt vare på. Eksporter gjerne dataene dine nå.');
    }
  } catch (err) {
    showRecovery(err);
  }
}
</script>
